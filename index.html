<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PawPass - Digital Pet Passport</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      color: white;
      padding: 20px;
    }
    .logo {
      width: 80px;
      height: 80px;
      background: white;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 40px;
    }
    h1 {
      font-size: 32px;
      margin-bottom: 12px;
    }
    p {
      font-size: 16px;
      opacity: 0.9;
      margin-bottom: 24px;
    }
    .links {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .link-card {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      padding: 20px 32px;
      border-radius: 16px;
      text-decoration: none;
      color: white;
      transition: transform 0.2s, background 0.2s;
    }
    .link-card:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.25);
    }
    .link-card span {
      display: block;
      font-size: 14px;
      opacity: 0.8;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🐾</div>
    <h1>PawPass</h1>
    <p>Digital Pet Passport - View shared pet passports</p>
    <div class="links">
      <a href="https://pawpass.app" class="link-card">
        Get the App
        <span>Manage your pets</span>
      </a>
      <a href="https://github.com/anomalyco/pawpass" class="link-card">
        GitHub
        <span>Source code</span>
      </a>
    </div>
  </div>
</body>
</html>
